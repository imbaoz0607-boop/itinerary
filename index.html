<!doctype html>
<html lang="zh-Hant">
<head>
 <meta charset="utf-8" />
 <meta name="viewport" content="width=device-width, initial-scale=1" />
 <title>東京｜主行程模板 v5</title>
 <style>
 :root {
  --bg: #f1f3f7;
  --surface: #ffffff; 
  --text: #2d2a26;
  --muted: #7a736b;
  --line: #e3e6ee;
  --accent: #8c6b4f;
  --chip: #f3ece3;
  --shadow: 0 10px 30px rgba(0,0,0,.06);
  --radius: 20px;
  --gap: 14px;
 }
 * { box-sizing: border-box; }
 html, body { margin: 0; padding: 0; }
 body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
 }
 .container {
  width: min(100%, 980px);
  margin: 0 auto;
  padding: 16px 8px 20px;
 }
 .hero { margin-bottom: 12px; }
 .tabShell {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 28px;
  box-shadow: var(--shadow);
  overflow: visible; 
  margin-bottom: 14px;
 }
 .topTabs {
  display: flex;
  flex-wrap: nowrap;
  gap: 10px;
  padding: 12px 14px;
  margin: 0;
  background: var(--surface);
  border: 0;
  border-radius: 0;
  box-shadow: none;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  position: sticky;
  top: 0;
  z-index: 50;
 }
 .topTabs::-webkit-scrollbar { height: 6px; }
 .topTabs::-webkit-scrollbar-thumb { background: #d8cfc3; border-radius: 999px; }
 .tabBtn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 42px;
  padding: 0 16px;
  border-radius: 999px;
  border: 1px solid #d6d6db;
  background: #f7f7f9;
  color: #1f2430;
  text-decoration: none;
  font-size: 15px;
  line-height: 1;
  white-space: nowrap;
  transition: all .18s ease;
  cursor: pointer;
 }
 .tabBtn.active {
  border-color: #3b6cff;
  background: #f9fbff;
  box-shadow: inset 0 0 0 1px rgba(59,108,255,.08);
 }
 .tabsDivider {
  width: 100%;
  height: 1px;
  background: var(--line);
 }
 .daySection { scroll-margin-top: 18px; }

 .heroTitleCard {
  border: none;
  border-radius: 0;
  padding: 8px 4px;
  margin-bottom: 8px;
  background: transparent;
 }
 
 .heroFlights {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
 }
 .heroFlightCard {
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 10px 12px;
  background: rgba(255, 255, 255, .03);
 }
 .heroFlightTitle {
  margin: 0;
  font-size: 14px;
  line-height: 1.4;
  font-weight: 700;
  color: var(--text);
 }
 .heroFlightList {
  margin: 6px 0 0;
  padding-left: 18px;
  font-size: 14px; 
 }
 .heroFlightList li + li { margin-top: 3px; }
 .heroFlightList strong { font-weight: 700; }
 
 .title {
  margin: 0;
  font-size: clamp(24px, 4vw, 34px);
  line-height: 1.25;
  font-weight: 800;
 }
 .pagePanel {
  display: none;
  margin: 0;
  border: 0;
  border-radius: 0;
  box-shadow: none;
 }
 .pagePanel.active { display: block; }
 .card {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 0; 
  margin-bottom: var(--gap);
  box-shadow: var(--shadow);
  overflow: hidden;
 }
 .tabShell .card {
  margin-bottom: 0;
  border: 0;
  border-radius: 0;
  box-shadow: none;
 }
 .dayCardHeader {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  padding: 14px 18px 10px;
  border-bottom: none;
 }
 .dayHeaderMain {
  display: flex;
  align-items: center;
  gap: 14px;
  min-width: 0;
 }
 .dayIndex {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 52px;
  min-width: 52px;
  height: 48px;
  border-radius: 16px;
  border: 1px solid #9ec0ff;
  background: #eaf2ff;
  color: #173d7a;
  font-size: 17px;
  font-weight: 800;
  line-height: 1;
 }
 .dayHeading {
  min-width: 0;
  font-size: 19px;
  font-weight: 800;
  line-height: 1.3;
  color: #16253b;
 }
 .dayTitle {
  margin: 0;
  font-size: 21px;
  line-height: 1.3;
 }
 .dayDate {
  font-size: 17px;
  font-weight: 800;
  color: #16253b;
  letter-spacing: .4px;
  white-space: nowrap;
 }
 .dayBody { padding: 12px 16px; }

 .timeline {
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 12px 10px;
  background: #fff;
  box-shadow: 0 6px 16px rgba(0,0,0,.04);
  display: flex;
  flex-direction: column;
  gap: 8px;
 }
 .dayMeta {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 0 0 10px;
  padding: 0;
  list-style: none;
 }
 .chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  background: var(--chip);
  border-radius: 9999px;
  color: #5f5448;
  font-size: 13px;
 }

 .tRow {
  display: flex !important;
  flex-direction: row !important;
  align-items: flex-start !important; 
  gap: 10px;
  padding: 2px 0;
  width: 100%;
 }
 .tRow:first-child {
  padding-top: 0;
 }
 .time {
  width: 90px;
  min-width: 90px;
  flex-shrink: 0;
  font-weight: 700;
  color: #000;
  letter-spacing: .2px;
  line-height: 1.35 !important;
  margin: 0 !important;
  padding: 0 !important;
 }
 .place { 
  flex: 1;
  min-width: 0; 
 }
 .place p,
 .placeTitle {
  margin: 0 !important;
  padding: 0 !important;
  font-size: 16px;
  font-weight: 700;
  line-height: 1.25 !important; 
 }

 .placeTitle {
  margin-bottom: 0 !important;
 }

 .meta {
  margin: 4px 0 0 0 !important;
  color: var(--muted);
  font-size: 13px; 
  white-space: pre-line;
  line-height: 1.4;
 }
 .place p.meta[style*="HOTEL"], 
 .place p.meta {
  font-size: 13px;
 }
 #day1 .tRow:nth-child(3) .place p.meta {
  font-size: 11px !important; 
 }
 .notes {
  margin: 6px 0 0;
  padding-left: 1.2em;
  font-size: 14px; 
 }
 .notes li + li { margin-top: 3px; }
 .gallery {
  margin-top: -2px;
 }
 .galleryTitle {
  padding-left: 0;
  margin: 0 0 6px;
  font-size: 14px;
  font-weight: 700;
 }
 .galleryRow {
  display: flex;
  gap: 12px;
  overflow-x: auto;
  overflow-y: hidden;
  scroll-snap-type: x mandatory;
  -webkit-overflow-scrolling: touch;
  padding-left: 0;
  scroll-behavior: smooth;
  cursor: grab;
 }
 .galleryRow::-webkit-scrollbar { display: none; }
 .galleryRow.dragging { cursor: grabbing; }

 .gItem {
  flex: 0 0 auto;
  width: 72vw;
  max-width: 260px;
  aspect-ratio: 3 / 2;
  border-radius: 16px;
  overflow: hidden;
  border: 1px solid var(--line);
  background: #faf8f4;
  box-shadow: 0 6px 16px rgba(0,0,0,.08);
  scroll-snap-align: center;
  position: relative;
 } 
 .gItem img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: box-shadow 0.2s ease;
 }
 .gItem img:hover {
  box-shadow: 0 8px 20px rgba(0,0,0,.12);
 }

 .gItem[data-caption]::after {
  content: attr(data-caption);
  position: absolute;
  left: 8px; right: 8px; bottom: 8px;
  padding: 6px 8px;
  border-radius: 12px;
  background: rgba(17,24,39,.62);
  color: #fff;
  font-size: 12px;
  line-height: 1.35;
  letter-spacing: .2px;
  pointer-events: none;
  text-shadow: 0 1px 2px rgba(0,0,0,.25);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
 }

 details.infoBox {
  margin-top: 10px;
  margin-left: 0;
  margin-right: 0;
  border-top: 1px solid var(--line);
  border-bottom: 0; 
  border-left: 0;
  border-right: 0;
  border-radius: 0;
  background: #fcfaf7;
  overflow: hidden;
  width: 100%;
 }
 
 details.no-border-box {
  border: none !important;
  margin-top: 0 !important;
  margin-bottom: 0 !important;
  box-shadow: none !important;
  background: transparent !important;
 }
 details.no-border-box > summary {
  border: none !important;
  outline: none !important;
  box-shadow: none !important;
 }

 details.infoBox > summary {
  list-style: none;
  cursor: pointer;
  padding: 10px 0; 
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
 }
 details.infoBox > summary::-webkit-details-marker { display: none; }
 .summaryText { min-width: 0; }
 .transportLine { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
 .transportLine a { font-size: 16px; text-decoration: none;
 color: inherit; font-weight: inherit; }
 .transportIcon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 22px;
  height: 22px;
  margin-left: 4px;
  border-radius: 6px;
  text-decoration: none !important;
  font-size: 14px;
  line-height: 1;
  color: inherit;
 }
 .summaryText a {
  text-decoration: none !important;
  color: inherit !important;
 }
 .transportIcon:hover { background: #f1f3f7; }
 .chev {
  color: var(--muted);
  transition: transform .2s ease;
  flex: 0 0 auto;
  padding-right: 4px;
 }
 details[open] .chev { transform: rotate(180deg); }
 .infoContent {
  padding: 0 0 12px 0; 
  color: #4d463f;
 }
 .btnRow {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 8px;
 }
 .btn {
  display: inline-flex;
